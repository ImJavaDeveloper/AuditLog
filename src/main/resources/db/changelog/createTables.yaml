databaseChangeLog:
  - changeSet:
      id: 1
      author: Rahat.Ali
      changes:
        - createTable:
            tableName: user
            columns:
              - column:
                  name: username
                  type: VARCHAR(100)
                  constraints:
                    primaryKey: true
              - column:
                  name: password
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: firstName
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: lastName
                  type: VARCHAR(100)
                  constraints:
                    nullable: false

        - createTable:
            tableName: auditLog
            columns:
              - column:
                  name: logId
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: tableName
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: action
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
              - column:
                  name: oldValue
                  type: VARCHAR(1000)
                  constraints:
                    nullable: true
              - column:
                  name: newValue
                  type: VARCHAR(1000)
                  constraints:
                    nullable: true
              - column:
                  name: changeBy
                  type: VARCHAR(100)
                  constraints:
                    nullable: true
              - column:
                  name: creationOrUpdateTime
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: true

  - changeSet:
      id: idx_tableName_action
      author: rahat.ali
      changes:
        - createIndex:
            indexName: idx_tableName_action
            tableName: auditLog
            columns:
              - column:
                  name: tableName
              - column:
                  name: action